name: Telegga APK

on:
  push:
    branches: [mygram-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure application
        env:
          TG_ID: ${{ secrets.API_ID }}
          TG_HASH: ${{ secrets.API_HASH }}
          FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$TG_ID" && test -n "$TG_HASH" && test -n "$FIREBASE" || { echo "Missing secrets"; exit 1; }
          printf 'apiId=%s\napiHash=%s\nhelperBotId=0\nhelperBotUsername=\nsentryDsn=\nmapsApiKey=\n' "$TG_ID" "$TG_HASH" > local.properties
          printf '%s' "$FIREBASE" | base64 -d > TMessagesProj_App/google-services.json

      - name: Build APK
        run: |
          (while true; do echo "==== RESOURCES $(date -u) ===="; free -m; df -h .; cat /sys/fs/cgroup/memory.events 2>/dev/null || true; sleep 60; done) &
          MONITOR=$!
          trap "kill $MONITOR 2>/dev/null || true" EXIT
          ./gradlew :TMessagesProj_App:assembleDebug --no-daemon --max-workers=1 --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload Telegga
        uses: actions/upload-artifact@v4
        with:
          name: Telegga-Android
          path: TMessagesProj_App/build/outputs/apk/debug/*-arm64-v8a.apk
          if-no-files-found: error
